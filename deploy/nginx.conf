# Purr Pause 落地页 — nginx 站点配置参考
#
# 这是「文档性质」的参考配置，不由 CI 自动应用。在阿里云服务器上把它放到
#   /etc/nginx/conf.d/purrpause.conf
# 然后 `nginx -t && systemctl reload nginx`。
#
# 部署前替换两处占位：
#   1. server_name  → 你备案通过的域名（如 purrpause.com www.purrpause.com）
#   2. root         → 与 deploy-site.yml 里的 DEPLOY_PATH 一致（如 /var/www/purrpause）
#
# 备案提示：网站必须在页脚展示 ICP 备案号（site/index.html 已留占位 {{ICP_BEIAN_NUMBER}}，
# 备案下来后填入）。备案号未下来前，域名不能对外正式提供服务。

# ---------- 阶段一：仅 HTTP（备案/证书就绪前先用这个把站点跑起来） ----------
server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_YOUR_DOMAIN;   # 如 purrpause.com www.purrpause.com

    root /var/www/purrpause;                 # 与 DEPLOY_PATH 一致
    index index.html;

    # gzip 压缩文本资源（.exe 不在 OSS 上，这里不涉及大文件）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # HTML 不缓存，保证文案/版本号改动即时可见
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 静态资源（图片、css、js）长缓存
    location ~* \.(?:css|js|gif|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

